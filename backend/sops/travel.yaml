- id: SOP-TR-01
  category: travel
  severity: medium
  applies_when: >
    Travelling or commuting by any means: driving, bus, train, flight, cab,
    walking or riding to work or school, a road trip.
  conditions:
    precipitation_probability: { gte: 70 }   # %
  advice: >
    Rain is likely (a 70% chance or more). Warn of possible delays and
    waterlogged roads, recommend checking traffic and transport alerts before
    leaving, and allow extra travel time.
  cite_as: "SOP-TR-01 - Rain likely, travel delays"

- id: SOP-TR-02
  category: travel
  severity: high
  applies_when: >
    Travelling or commuting by any means, especially on two-wheelers or on foot.
  conditions:
    weather_code: { gte: 95 }   # WMO codes 95-99 = thunderstorm
  advice: >
    Thunderstorms are forecast. Advise postponing non-essential travel until the
    storm passes. If the trip cannot wait: no two-wheelers, avoid flooded
    underpasses and low-lying roads, and never shelter under an isolated tree.
  cite_as: "SOP-TR-02 - Thunderstorm, travel"

- id: SOP-TR-03
  category: travel
  severity: low
  applies_when: >
    Travelling or commuting by any means: driving, bus, train, cab, walking or
    riding to work or school.
  conditions:
    precipitation_probability: { gte: 30, lt: 70 }   # %
  advice: >
    There is a moderate chance of rain (30-70%). Carry an umbrella or rain gear
    and expect minor delays; there is no need to change plans.
  cite_as: "SOP-TR-03 - Possible showers, travel"
