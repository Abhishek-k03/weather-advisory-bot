services:
  - type: web
    name: weather-advisory-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: GROQ_API_KEY
        sync: false   # set in the Render dashboard, never committed
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b

  - type: web
    name: weather-advisory-ui
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run frontend/app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: BACKEND_URL
        sync: false   # e.g. https://weather-advisory-api.onrender.com
